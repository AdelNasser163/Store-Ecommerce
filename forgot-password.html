<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نسيت كلمة المرور | AlMumex</title>
  <meta name="description" content="اطلب رابط إعادة تعيين كلمة المرور لحسابك في متجر AlMumex.">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" data-auth-page="forgot-password">
  <main class="auth-shell">
    <section class="auth-card auth-card-compact" aria-labelledby="forgot-title">
      <header class="auth-brand"><img src="assets/images/logo.png" alt="AlMumez Online Store"><h1 id="forgot-title">نسيت كلمة المرور؟</h1><p>اكتب بريدك الإلكتروني وهنبعتلك رابط لإعادة تعيين كلمة المرور.</p></header>
      <div class="auth-message" data-auth-message role="status" aria-live="polite" hidden></div>
      <form class="auth-form" data-auth-form="forgot" novalidate>
        <label for="forgot-email">البريد الإلكتروني</label>
        <div class="auth-input"><span class="material-symbols-outlined">mail</span><input id="forgot-email" name="email" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com" required></div>
        <small class="auth-error" data-error-for="forgot-email"></small>
        <button class="auth-submit" type="submit"><span>إرسال رابط إعادة التعيين</span><i aria-hidden="true"></i></button>
      </form>
      <button class="auth-resend" type="button" data-resend hidden disabled>إعادة الإرسال <span data-resend-count></span></button>
      <a class="auth-return" href="auth.html"><span class="material-symbols-outlined">arrow_forward</span>العودة لتسجيل الدخول</a>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
