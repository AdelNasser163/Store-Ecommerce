<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إعادة تعيين كلمة المرور | AlMumex</title>
  <meta name="description" content="أنشئ كلمة مرور جديدة لحسابك في متجر AlMumex.">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" data-auth-page="reset-password">
  <main class="auth-shell">
    <section class="auth-card auth-card-compact" aria-labelledby="reset-title">
      <header class="auth-brand"><img src="assets/images/logo.png" alt="AlMumez Online Store"><h1 id="reset-title">إعادة تعيين كلمة المرور</h1><p>اكتب كلمة مرور قوية وجديدة لحسابك.</p></header>
      <div class="auth-message" data-auth-message role="status" aria-live="polite" hidden></div>
      <div class="auth-invalid-link" data-invalid-token hidden><span class="material-symbols-outlined">link_off</span><h2>الرابط غير صالح أو منتهي</h2><p>اطلب رابطًا جديدًا لإعادة تعيين كلمة المرور.</p><a class="auth-submit" href="forgot-password.html">اطلب رابط جديد</a></div>
      <form class="auth-form" data-auth-form="reset" novalidate>
        <label for="reset-password">كلمة المرور الجديدة</label>
        <div class="auth-input"><span class="material-symbols-outlined">lock</span><input id="reset-password" name="password" type="password" dir="ltr" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" aria-label="إظهار كلمة المرور"><span class="material-symbols-outlined">visibility</span></button></div>
        <small class="auth-error" data-error-for="reset-password"></small>
        <label for="reset-confirm">تأكيد كلمة المرور</label>
        <div class="auth-input"><span class="material-symbols-outlined">verified_user</span><input id="reset-confirm" name="confirmPassword" type="password" dir="ltr" autocomplete="new-password" minlength="8" required><button class="auth-password-toggle" type="button" aria-label="إظهار كلمة المرور"><span class="material-symbols-outlined">visibility</span></button></div>
        <small class="auth-error" data-error-for="reset-confirm"></small>
        <button class="auth-submit" type="submit"><span>تحديث كلمة المرور</span><i aria-hidden="true"></i></button>
      </form>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
